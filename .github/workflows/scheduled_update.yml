name: Weekly Price Update

on:
  schedule:
    # 毎週日曜 09:00 UTC = 日曜 18:00 JST
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run pricing scraper
        run: python src/agents/watcher/scrapers/jankara_pricing.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Regenerate station pages
        run: python src/agents/publisher/page_generator.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Weekly price update"
          file_pattern: "data/karaoke/*.json data/*.json website/content/stations/*.md website/content/areas/*.md"
          commit_author: "karaoke-bot <bot@example.com>"
